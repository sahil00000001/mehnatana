# Manual only (GitHub → Actions → Demo businesses → Run workflow):
# create, reset or delete the two demo businesses (Shri Ram Kirana Stores and Annapurna Sweets)
# on the live database. There are no business logins: the one login opens them from All companies.
name: Demo businesses

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create, reset (delete and create again) or delete"
        type: choice
        options: [create, reset, delete]
        default: create

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Demo businesses on the live database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_SCHEMA: mehnatana
          DEBUG: "False"
          SECRET_KEY: demo-only-not-used-for-requests
          FILE_STORAGE: database
          ACTION: ${{ inputs.action }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is not set."; exit 1; fi
          case "$ACTION" in
            create) python manage.py seed_demo ;;
            reset)  python manage.py seed_demo --reset ;;
            delete) python manage.py seed_demo --delete ;;
            *) echo "Unknown action: $ACTION"; exit 1 ;;
          esac
