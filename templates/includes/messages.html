{% if messages %}
<ul class="messages">
  {% for message in messages %}
  <li class="msg {% if message.tags == 'success' %}msg-success{% elif message.tags == 'warning' %}msg-warning{% elif message.tags == 'error' %}msg-error{% else %}msg-info{% endif %}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}
